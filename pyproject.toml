[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "natural"
version = "0.1.0"
description = "Software AG Natural to Semantic Intermediate Representation (IR) compiler and Python code generator"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "lark>=1.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
natural = "natural.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
natural = ["grammar/*.lark"]

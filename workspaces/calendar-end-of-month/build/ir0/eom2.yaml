name: EOM2
data_areas:
- name: INLINE_LOCAL
  scope: LOCAL
  inline_fields:
  - level: 1
    name: '#DATE'
    format:
      kind: date
      raw_spec: D
    init_val: D'01/28/2006'
  - level: 1
    name: '#T'
    format:
      kind: alphanumeric
      raw_spec: A8
      length: 8
      digits: 8
  - level: 2
    name: '#DD'
    format:
      kind: numeric
      raw_spec: N2
      length: 2
      digits: 2
    parent_name: '#T'
  - level: 1
    name: '#D'
    format:
      kind: date
      raw_spec: D
  redefines:
  - level: 1
    target_name: '#T'
body:
- statement_type: INPUT
  fields:
  - kind: ref
    value: '#DATE'
- statement_type: MOVE
  source:
    kind: ref
    value: '#DATE'
  target:
    kind: ref
    value: '#T'
  edit_mask: DDMMYYYY
  is_move_all: false
- statement_type: IF
  condition:
    kind: binary_op
    operator: <
    left:
      kind: ref
      value: '#DD'
    right:
      kind: literal
      value: 28
  then_branch:
  - statement_type: ASSIGN
    target:
      kind: ref
      value: '#DD'
    value:
      kind: literal
      value: 28
    rounded: false
- statement_type: REPEAT
  loop_type: UNTIL
  condition:
    kind: binary_op
    operator: '='
    left:
      kind: ref
      value: '#DD'
    right:
      kind: literal
      value: 1
  body:
  - statement_type: MOVE
    source:
      kind: ref
      value: '#T'
    target:
      kind: ref
      value: '#D'
    edit_mask: DDMMYYYY
    is_move_all: false
  - statement_type: ASSIGN
    target:
      kind: ref
      value: '#D'
    value:
      kind: binary_op
      operator: +
      left:
        kind: ref
        value: '#D'
      right:
        kind: literal
        value: 1
    rounded: false
  - statement_type: MOVE
    source:
      kind: ref
      value: '#D'
    target:
      kind: ref
      value: '#T'
    edit_mask: DDMMYYYY
    is_move_all: false
- statement_type: ASSIGN
  target:
    kind: ref
    value: '#D'
  value:
    kind: binary_op
    operator: '-'
    left:
      kind: ref
      value: '#D'
    right:
      kind: literal
      value: 1
  rounded: false
- statement_type: PRINT
  fields:
  - kind: literal
    value: 'EOM:'
  - kind: ref
    value: '#DATE'
  - kind: ref
    value: '#D'

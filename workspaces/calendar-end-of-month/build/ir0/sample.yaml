name: SAMPLE
data_areas:
- name: INLINE_LOCAL
  scope: LOCAL
  inline_fields:
  - level: 1
    name: '#OFFSET'
    format:
      kind: integer
      raw_spec: I2
      length: 2
      digits: 2
    max_index: 1
    is_periodic: false
    is_multiple: false
    init_val: '1'
  views:
  - level: 1
    view_name: MYVIEW
    ddm_name: EMPLOYEES
    fields:
    - level: 2
      name: NAME
    - level: 2
      name: LANG
      array_dim: '#OFFSET:#OFFSET + 5'
    - level: 2
      name: LANG
      array_dim: '1:1'
  - level: 1
    view_name: MYVIEW2
    ddm_name: EMPLOYEES
    fields:
    - level: 2
      name: LANG
      array_dim: '1:6'
body:
- statement_type: READ
  view_name: MYVIEW
  by_descriptor: NAME
  starting_from:
    kind: literal
    value: SMITH
  body:
  - statement_type: WRITE
    items:
    - kind: literal
      value: 5
    - kind: ref
      value: T
    - kind: ref
      value: LANG
      array_dim: (#OFFSET.#OFFSET:#OFFSET + 5)
    - kind: literal
      value: 35
    - kind: ref
      value: T
    - kind: literal
      value: <== LANG (1:6) AFTER READ
  - statement_type: ASSIGN
    target:
      kind: ref
      value: LANG
      array_dim: '1.1'
      array_indices:
      - kind: literal
        value: 1
      - kind: literal
        value: 1
    value:
      kind: literal
      value: '***'
    rounded: false
  - statement_type: ASSIGN
    target:
      kind: ref
      value: '#OFFSET'
    value:
      kind: literal
      value: 2
    rounded: false
  - statement_type: WRITE
    items:
    - kind: literal
      value: 5
    - kind: ref
      value: T
    - kind: ref
      value: LANG
      array_dim: (1.1)
    - kind: literal
      value: 35
    - kind: ref
      value: T
    - kind: literal
      value: <== LANG (1.1) AFTER TWO ASSIGNS
    - kind: literal
      value: /
    - kind: literal
      value: 5
    - kind: ref
      value: T
    - kind: ref
      value: LANG
      array_dim: (#OFFSET.#OFFSET:#OFFSET + 4)
    - kind: literal
      value: 35
    - kind: ref
      value: T
    - kind: literal
      value: <== LANG (2:6) AFTER TWO ASSIGNS
  - statement_type: UPDATE
  - statement_type: GET
    view_name: MYVIEW2
    arguments:
    - kind: sys_var
      value: '*ISN'
  - statement_type: WRITE
    items:
    - kind: literal
      value: 5
    - kind: ref
      value: T
    - kind: ref
      value: MYVIEW2.LANG
      array_dim: (1:6)
    - kind: literal
      value: 35
    - kind: ref
      value: T
    - kind: literal
      value: <== AFTER UPDATE AND GET
    - kind: literal
      value: /
    - kind: literal
      value: 5
    - kind: ref
      value: T
    - kind: literal
      value: '-------------------------------------------------------'
  - statement_type: ASSIGN
    target:
      kind: ref
      value: '#OFFSET'
    value:
      kind: literal
      value: 1
    rounded: false

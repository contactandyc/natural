ir_version: '1.0'
module_id: mod.sample
symbols:
  '#OFFSET':
    id: sym.local.offset
    name: '#OFFSET'
    scope: local
    semantic_type:
      base: integer
      length: 2
      storage: binary
    redefine_offset: 0
    is_array: false
    init_val: '1'
  MYVIEW.NAME:
    id: sym.entity.myview.name
    name: NAME
    scope: entity_field
    semantic_type:
      base: string
    redefine_offset: 0
    is_array: false
  MYVIEW.LANG:
    id: sym.entity.myview.lang
    name: LANG
    scope: entity_field
    semantic_type:
      base: string
    redefine_offset: 0
    is_array: true
  MYVIEW2.LANG:
    id: sym.entity.myview2.lang
    name: LANG
    scope: entity_field
    semantic_type:
      base: string
    redefine_offset: 0
    is_array: true
operations:
- op: query_iteration
  id: loop.read_001
  entity: EMPLOYEES
  natural_view: MYVIEW
  predicate:
    op: gte
    lhs:
      op: entity_field
      symbol_id: sym.entity.myview.name
    rhs:
      op: literal
      value: SMITH
  cardinality: many
  body:
  - op: write
    operands:
    - op: tab
      value: 5
    - op: ref
      symbol_id: sym.entity.myview.lang
      substring:
        start:
          op: ref
          symbol_id: sym.local.offset
        length:
          op: add
          lhs:
            op: ref
            symbol_id: sym.local.offset
          rhs:
            op: literal
            value: 5
      array_indices:
      - op: ref
        symbol_id: sym.local.offset
    - op: tab
      value: 35
    - op: literal
      value: <== LANG (1:6) AFTER READ
    is_write: true
  - op: assign
    target_id: sym.entity.myview.lang
    target_indices:
    - op: literal
      value: 1
    - op: literal
      value: 1
    expr:
      op: literal
      value: '***'
    rounded: false
  - op: assign
    target_id: sym.local.offset
    expr:
      op: literal
      value: 2
    rounded: false
  - op: write
    operands:
    - op: tab
      value: 5
    - op: ref
      symbol_id: sym.entity.myview.lang
      array_indices:
      - op: literal
        value: 1
      - op: literal
        value: 1
    - op: tab
      value: 35
    - op: literal
      value: <== LANG (1.1) AFTER TWO ASSIGNS
    - op: newline
      value: /
    - op: tab
      value: 5
    - op: ref
      symbol_id: sym.entity.myview.lang
      substring:
        start:
          op: ref
          symbol_id: sym.local.offset
        length:
          op: add
          lhs:
            op: ref
            symbol_id: sym.local.offset
          rhs:
            op: literal
            value: 4
      array_indices:
      - op: ref
        symbol_id: sym.local.offset
    - op: tab
      value: 35
    - op: literal
      value: <== LANG (2:6) AFTER TWO ASSIGNS
    is_write: true
  - op: entity_update
    target_loop_id: loop.read_001
    entity: EMPLOYEES
  - op: entity_get
    target_var: myview2_record
    entity: EMPLOYEES
    natural_view: MYVIEW2
    key_expr:
      op: ref
      symbol_id: sym.entity.active.id
  - op: write
    operands:
    - op: tab
      value: 5
    - op: ref
      symbol_id: sym.entity.myview2.lang
      substring:
        start:
          op: literal
          value: 1
        length:
          op: literal
          value: 6
    - op: tab
      value: 35
    - op: literal
      value: <== AFTER UPDATE AND GET
    - op: newline
      value: /
    - op: tab
      value: 5
    - op: literal
      value: '-------------------------------------------------------'
    is_write: true
  - op: assign
    target_id: sym.local.offset
    expr:
      op: literal
      value: 1
    rounded: false

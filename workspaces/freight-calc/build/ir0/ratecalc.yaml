name: RATECALC
data_areas:
- name: TARIFF-P
  scope: PARAMETER
- name: INLINE_LOCAL
  scope: LOCAL
  inline_fields:
  - level: 1
    name: '#BASE-CHARGE'
    format:
      kind: packed_decimal
      raw_spec: P9.2
      length: 9
      digits: 9
      decimals: 2
    max_index: 1
    is_periodic: false
    is_multiple: false
  - level: 1
    name: '#SURCHARGE'
    format:
      kind: packed_decimal
      raw_spec: P7.2
      length: 7
      digits: 7
      decimals: 2
    max_index: 1
    is_periodic: false
    is_multiple: false
body:
- statement_type: FIND
  view_name: TARIFF-VIEW
  descriptor: CLASS
  operand:
    kind: ref
    value: '#SHIP-CLASS'
  criteria:
    kind: binary_op
    operator: '='
    left:
      kind: ref
      value: CLASS
    right:
      kind: ref
      value: '#SHIP-CLASS'
  limit: 1
  body:
  - statement_type: ASSIGN
    target:
      kind: ref
      value: '#BASE-CHARGE'
    value:
      kind: binary_op
      operator: '*'
      left:
        kind: ref
        value: RATE
      right:
        kind: ref
        value: '#SHIP-WEIGHT'
    rounded: false
  - statement_type: IF
    condition:
      kind: binary_op
      operator: '>'
      left:
        kind: ref
        value: '#SHIP-WEIGHT'
      right:
        kind: ref
        value: WEIGHT-LIMIT
    then_branch:
    - statement_type: ASSIGN
      target:
        kind: ref
        value: '#SURCHARGE'
      value:
        kind: ref
        value: HEAVY-SURCHARGE
      rounded: false
    - statement_type: ESCAPE
      target: BOTTOM
